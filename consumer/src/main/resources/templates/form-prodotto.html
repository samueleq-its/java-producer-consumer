<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${prodotto.id == null ? 'Nuovo Prodotto' : 'Modifica Prodotto'}">Prodotto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1 th:text="${prodotto.id == null ? 'Nuovo Prodotto' : 'Modifica Prodotto'}">Prodotto</h1>

<div th:if="${errore}" class="alert alert-error" th:text="${errore}"></div>

<form th:action="@{/prodotti/salva}" method="post" class="form-prodotto">
    <input type="hidden" name="id" th:value="${prodotto.id}">
    
    <div class="form-group">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome" 
               th:value="${prodotto.nome}" required 
               placeholder="Inserisci il nome del prodotto">
    </div>

    <div class="form-group">
        <label for="descrizione">Descrizione</label>
        <textarea id="descrizione" name="descrizione" 
                  th:text="${prodotto.descrizione}" 
                  placeholder="Inserisci la descrizione del prodotto" rows="4"></textarea>
    </div>

    <div class="form-group">
        <label for="prezzo">Prezzo *</label>
        <input type="number" id="prezzo" name="prezzo" 
               th:value="${prodotto.prezzo}" required 
               step="0.01" min="0" placeholder="0.00">
    </div>

    <div class="form-group">
        <label for="categoria">Categoria *</label>
        <select id="categoria" name="categoria" required>
            <option value="">Seleziona una categoria</option>
            <option th:each="c : ${categorieDisponibili}"
                    th:value="${c}" th:text="${c}"
                    th:selected="${c == prodotto.categoria}">Categoria</option>
        </select>
    </div>

    <div class="form-group">
        <label for="quantita">Quantità *</label>
        <input type="number" id="quantita" name="quantita" 
               th:value="${prodotto.quantita}" required 
               min="0" placeholder="0">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-success">
            <span th:text="${prodotto.id == null ? 'Crea Prodotto' : 'Salva Modifiche'}">Salva</span>
        </button>
        <a th:href="@{/prodotti}" class="btn btn-secondary">Annulla</a>
    </div>
</form>

</body>
</html>

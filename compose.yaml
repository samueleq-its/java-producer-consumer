services:
  mysqldb:
    image: mysql:9.7
    restart: unless-stopped
    container_name: mysqldb
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=esercitazione_api
    ports:
      - 3305:3306
    volumes:
      - mysqldb:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  producer:
    # build: ./producer
    image: samueleqits/producer-api:1.0
    restart: on-failure
    container_name: producer
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/esercitazione_api
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_SQL_INIT_MODE=never
      - SPRING_SECURITY_ENABLE=true
      - SPRING_SECURITY_API_KEY=189f81e6-13ed-4ec2-8a5b-506fa9cf47e9
    ports:
      - 8081:8081
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  consumer:
    # build:
    #   context: ./consumer
    #   dockerfile: Dockerfile
    image: samueleqits/consumer-web:1.0
    restart: on-failure
    container_name: consumer
    depends_on:
      producer:
        condition: service_healthy
    environment:
      - API_BASE_URL=http://producer:8081/api
      - API_KEY=189f81e6-13ed-4ec2-8a5b-506fa9cf47e9
    ports:
      - 8082:8082
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysqldb:
    driver: local
